<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Dash</title>
  <link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&amp;display=swap"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA+Guides&display=swap" rel="stylesheet">
    <!-- <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon"> -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/app.js" defer></script>
</head>
<body>
<!-- <div class="no-border-box">
    This div is NOT using border box and will be 368px wide.
</div> -->
<br/>
<main class="game-panel">
  <h1>Delivery Dash</h1>

  <p id="message">Ready to start.</p>
  <p>Time left: <span id="time-left">0</span> seconds</p>


  <div class="controls">
    <button class="action-button" id="start" type="button">
      Start shift
    </button>

    <button class="action-button" id="reset" type="button" disabled>
      Reset shift
    </button>

    <button class="action-button" id="open-instructions">
        How to Play
    </button>
  </div>

  <dialog id="instructions">
      <button id="close-instructions">❌</button>
    <h2>How to play</h2>
    <p>Complete deliveries before the battery runs out.</p>
  </dialog>

  <h2>Route preview</h2>

<div class="board">
  <button class="tile" type="button">1</button>
  <button class="tile" type="button">2</button>
  <button class="tile" type="button">3</button>
  <button class="tile" type="button">4</button>
  <button class="tile" type="button">5</button>
  <button class="tile" type="button">6</button>
</div>

</main>

</body>
</html>
